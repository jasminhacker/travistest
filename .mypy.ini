[mypy]
mypy_path = backend
files = backend,bin/raveberry
plugins = mypy_django_plugin.main
no_namespace_packages = True
[mypy-core.migrations.*]
ignore_errors = True
[mypy-celery.*,channels.*,mutagen.easymp4,mutagen,bs4,ipware,raveberry,mopidyapi.client,mopidyapi.exceptions,mopidyapi,yt_dlp,bs4]
ignore_missing_imports = True
[mypy.plugins.django-stubs]
django_settings_module = "backend.main.settings"
