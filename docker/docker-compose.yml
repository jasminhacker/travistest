volumes:
  songs-cache:
    # If you want to access downloaded files on your host system,
    # uncomment the following lines and choose a folder.
    # Make sure the folder is writable by UID 33 (eg chmod -R o+rw folder)
    #driver_opts:
    #  type: 'none'
    #  o: 'bind'
    #  device: '/path/to/folder/'
services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_DB=raveberry
      - POSTGRES_USER=raveberry
      - POSTGRES_PASSWORD=raveberry
    # Use this if you want to persist raveberry's database data
    #volumes:
    #  - /path/to/data/:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis
    restart: unless-stopped
  celery:
    image: raveberry/raveberry
    volumes:
      - songs-cache:/Music/raveberry
    depends_on:
      - db
      - redis
    environment:
      - PYTHONOPTIMIZE=1
      - ADMIN_PASSWORD
      - MOD_PASSWORD
      - REMOTE_URL
      - POSTGRES_HOST
      - POSTGRES_PORT
      - REDIS_HOST
      - REDIS_PORT
      - MOPIDY_HOST
      - MOPIDY_PORT
    command: celery -A core.tasks worker -O fair -c 6
    restart: unless-stopped
  daphne:
    image: raveberry/raveberry
    expose:
      - 9000
    volumes:
      - songs-cache:/Music/raveberry
    depends_on:
      - db
      - redis
      - celery
    environment:
      - PYTHONOPTIMIZE=1
      - ADMIN_PASSWORD
      - MOD_PASSWORD
      - REMOTE_URL
      - POSTGRES_HOST
      - POSTGRES_PORT
      - REDIS_HOST
      - REDIS_PORT
      - MOPIDY_HOST
      - MOPIDY_PORT
    restart: unless-stopped
  nginx:
    image: raveberry/raveberry-nginx
    ports:
      - "80:80"
    environment:
      - DAPHNE_HOST
      - DAPHNE_PORT
    depends_on:
      - daphne
    restart: unless-stopped
